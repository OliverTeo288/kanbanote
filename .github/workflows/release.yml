name: Release

# Triggers ONLY on semver tag pushes (e.g. git tag 1.2.0 && git push origin 1.2.0).
# Does not run on branch pushes or PRs — for that, see ci.yml.
#
# Stamps the version into manifest.json + package.json, builds the production
# bundle, and publishes a GitHub Release with the three required Obsidian
# plugin artefacts (main.js, manifest.json, styles.css).
#
# Tag format: no v prefix — 1.0.0 not v1.0.0.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # never cancel an in-flight release

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create releases, push version-bump commit

    steps:
      - name: Checkout (full history for tag inspection)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.VERSION_BUMP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "25"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

      - name: Stamp manifest.json
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            m.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2) + '\n');
          "

      - name: Stamp package.json
        run: npm version --no-git-tag-version --allow-same-version ${{ steps.version.outputs.version }}

      # Pushes the stamped manifest/package files back to main ONLY if the tag's
      # commit was missing the bump. If the manifest already matches the tag
      # version (preferred workflow: bump locally before tagging), no commit is
      # made and no push is attempted — this avoids non-fast-forward errors when
      # the tag commit has fallen behind main.
      - name: Commit version bump (if needed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Manifest already at version ${{ steps.version.outputs.version }} — skipping commit and push."
          else
            git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
            # Rebase onto latest main in case the tag commit lags behind.
            git fetch origin main
            git rebase origin/main || { echo "Rebase conflict — bump main manually before re-running."; exit 1; }
            git push origin HEAD:main
          fi

      - name: Build production bundle
        run: node esbuild.config.mjs production

      - name: Verify required artefacts exist
        run: |
          for f in main.js manifest.json styles.css; do
            [ -f "$f" ] || { echo "Missing: $f"; exit 1; }
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "### Released ${{ steps.version.outputs.version }} 🚀" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Install via [BRAT](https://github.com/TfTHacker/obsidian42-brat): \`${{ github.repository }}\`" >> "$GITHUB_STEP_SUMMARY"
